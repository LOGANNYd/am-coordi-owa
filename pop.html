<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM DATA</title>
<!-- Outlook 대화상자 창 (2026-10-02)
     패널(index.html)이 Office 대화상자(displayDialogAsync)로 이 페이지를 독립 창으로 띄운다 — 크롬 탭에 붙지 않음.
     이 페이지는 PC 앱의 '큰 창 전용 화면'(/?owa=1&pop=1#{함수, 인자})을 꽉 차게 담기만 한다. -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  html,body{margin:0;height:100%;background:#f6f7f9;font-family:"Segoe UI","Malgun Gothic",sans-serif}
  iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="app" title="AM DATA" allow="local-network-access; clipboard-write"></iframe>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var port = (qs.get('port') || '5174').replace(/\D/g,'') || '5174';
  var APP = 'http://127.0.0.1:' + port;
  document.getElementById('app').src = APP + '/?owa=1&pop=1' + location.hash;
  // 앱 안에서 창을 모두 닫으면 이 대화상자도 닫는다
  window.addEventListener('message', function(e){
    if(e.origin !== APP || !e.data) return;
    if(e.data.type === 'amai-close'){
      try{ Office.context.ui.messageParent('close'); }catch(err){ try{ window.close(); }catch(e2){} }
    }
    if(e.data.type === 'amai-title' && e.data.title){ document.title = e.data.title; }
    // 메일 작성은 패널이 연다(대화상자에선 작성창을 못 연다) → 패널로 넘긴다 (2026-10-06)
    // 교신내역 주소 → 열린 작성창의 AM DATA 패널이 받는다 (2026-10-08)
    if(e.data.type === 'amai-addr'){
      var d = e.data, src = e.source, id = 'a' + Date.now() + Math.random(), fin = false, bc = null;
      var reply = function(res){ try{ src.postMessage(Object.assign({type: 'amai-addr-result', id: d.id}, res), APP); }catch(x){} };
      try{ bc = new BroadcastChannel('amai-addr'); }catch(x){}
      if(!bc){ reply({ok: false, nocompose: true}); return; }
      bc.onmessage = function(m){ var x = m.data || {}; if(x.type === 'ack' && x.id === id && !fin){ fin = true; bc.close(); reply(x); } };
      bc.postMessage({type: 'req', id: id, addr: d.addr, kind: d.kind});
      setTimeout(function(){ if(!fin){ fin = true; bc.close(); reply({ok: false, nocompose: true}); } }, 1500);
    }
    if(e.data.type === 'amai-compose'){
      var ok = true;
      try{ Office.context.ui.messageParent(JSON.stringify({compose: e.data})); }catch(err){ ok = false; }
      try{ e.source.postMessage({type: 'amai-compose-result', id: e.data.id, ok: ok, error: ok ? '' : '패널에 전달하지 못했습니다'}, APP); }catch(err){}
    }
  });
  Office.onReady(function(){});
})();
</script>
</body>
</html>
