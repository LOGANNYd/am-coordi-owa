<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM 메일 양식</title>
<!--
  AM 메일 양식 (Light 2, 2026-11-17)
  · 프로그램 설치 없이 이 페이지 하나. GitHub Pages(mail.html)에 올려 웹 주소로 연다(file:// 로는 시트를 못 읽음).
  · 시트 읽기: Apps Script(apps_script\Code.gs, 주소+열쇠) 또는 '웹에 게시' CSV.
  · 시트 쓰기: Apps Script 일 때만 — 선박 정보의 선주사·국가 [수정].
  · 선명 검색 → 선박 정보(기본) / 재계약 알림(영·한) / 수주 알림 → [본문 복사] → 아웃룩에 Ctrl+V.
  · CHS·ERP·CRM 은 쓰지 않는다.
-->
<style>
:root{--bg:#f6f7f9;--line:#dfe4ec;--txt:#1c2430;--mut:#6b7686;--pri:#5030e5;--pri2:#4325c4;--k:#5b6675}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 "Segoe UI","Malgun Gothic",sans-serif}
#wrap{max-width:520px;margin:0 auto;padding:0 12px 24px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;gap:6px;align-items:center}
#q{flex:1;min-width:0;height:30px;border:1px solid #d9dee7;border-radius:6px;padding:0 10px;font:inherit;font-size:12.5px;background:#fff}
#q:focus{outline:none;border-color:#7c8cf8;box-shadow:0 0 0 3px rgba(91,108,240,.15)}
.btn{height:30px;padding:0 10px;border:1px solid var(--pri2);background:var(--pri);color:#fff;border-radius:6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.btn.gray{background:#fff;color:#4a5568;border-color:#cdd3de}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
#st{color:var(--mut);font-size:11px;margin:-4px 0 6px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
#res{display:none;max-height:230px;overflow:auto;padding:4px}
#res button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px;cursor:pointer;font:inherit;font-size:12.5px}
#res button:hover{background:#eef2ff}
#res .s{font-weight:700}#res .m{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:0 6px;margin-left:5px;vertical-align:1px}
.tag.b{background:#e3ecfd;color:#2b6cb0}.tag.s{background:#e3f4e8;color:#2f7d46}
.empty{color:var(--mut);padding:14px;text-align:center;font-size:12.5px}
#ship h2{font-size:15.5px;margin:0}
.tabs{display:flex;gap:4px;margin:8px 0 2px}
.tabs button{flex:1;border:1px solid #cdd3de;background:#fff;border-radius:6px;padding:5px 0;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:#4a5568;white-space:nowrap}
.tabs button.on{border-color:var(--pri);background:var(--pri);color:#fff}
/* 선박 정보 — 앱 카드와 같은 표 모양 */
.it{width:100%;border-collapse:collapse;font-size:12.5px}
.it td{padding:4px 6px;border-top:1px solid #eef1f5;vertical-align:middle}
.it tr:first-child td{border-top:0}
.it td.k{color:var(--k);width:96px;white-space:nowrap}
.it td.v{font-weight:600;word-break:break-word}
.it .g td{background:#f5f7fb;color:#2b6cb0;font-weight:800;font-size:11.5px;padding-top:6px}
.fe{border:1px solid #c5cdd9;background:#fff;cursor:pointer;color:#3b4a63;font-size:11px;font-weight:600;padding:1px 8px;margin-left:6px;border-radius:6px;line-height:16px;vertical-align:middle;font-family:inherit}
.fe:hover{border-color:#7c8cf8;color:#3442b8}
.fe-row{display:flex;gap:4px;align-items:center}
.fe-row input{flex:1;min-width:0;height:26px;border:1px solid #7c8cf8;border-radius:6px;padding:0 7px;font:inherit;font-size:12px}
.fe-msg{font-size:11px;color:var(--mut);margin-top:2px}
.form label{display:block;font-size:11.5px;font-weight:700;color:#3d4c63;margin:8px 0 2px}
.form input,.form textarea,.form select{width:100%;border:1px solid #cdd3de;border-radius:6px;padding:5px 8px;font:inherit;font-size:12.5px;background:#fff}
.form textarea{min-height:44px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sens{display:grid;grid-template-columns:1fr 74px 26px;gap:4px;margin-bottom:4px}
.sens button,.mini{border:1px solid #cdd3de;background:#fff;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
.mini{padding:2px 9px}
.pv-h{display:flex;gap:6px;align-items:center;margin:2px 0 6px}
.pv-h b{flex:1;font-size:12px;color:var(--k)}
.subj{background:#f5f7fb;border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin-bottom:6px;font-weight:600;font-size:12px;word-break:break-all}
#pv{border:1px solid var(--line);border-radius:6px;padding:10px;background:#fff;overflow:auto;max-height:520px}
.note{color:var(--mut);font-size:11px;margin-top:5px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:7px 14px;border-radius:8px;font-size:12.5px;z-index:99;display:none;max-width:90vw}
#set{display:none}
/* 행 편집 창 */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px}
.ov .win{background:#fff;border-radius:12px;width:100%;max-width:500px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.ov .wh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ov .wh b{flex:1;font-size:14px}
.ov .wb{overflow:auto;padding:4px 14px 10px}
.ov .wf{display:flex;gap:6px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.ed-g{font-size:11.5px;font-weight:800;color:#2b6cb0;background:#f5f7fb;margin:10px -14px 4px;padding:4px 14px}
.ed-r{display:grid;grid-template-columns:118px 1fr;gap:6px;align-items:center;padding:2px 0}
.ed-r label{font-size:11.5px;color:var(--k);word-break:break-all}
.ed-r input[type=text],.ed-r textarea{width:100%;border:1px solid #cdd3de;border-radius:6px;padding:4px 7px;font:inherit;font-size:12.5px}
.ed-r textarea{min-height:40px;resize:vertical}
.ed-r input.chg,.ed-r textarea.chg{border-color:#f59e0b;background:#fffbeb}
.ed-r input[type=checkbox]{width:18px;height:18px;justify-self:start}
details.ed-more summary{cursor:pointer;color:var(--mut);font-size:12px;margin-top:10px}
.sv-l{font-size:12px;margin:2px 0}.sv-l s{color:#9aa3b2}
#set .form label:first-child{margin-top:0}
</style>
</head>
<body>
<div id="wrap">
<header>
  <input id="q" placeholder="선명 · IMO · 프로젝트" autocomplete="off">
  <button class="btn" id="find">찾기</button>
  <button class="btn gray" id="reload" title="구글시트 다시 읽기">⟳</button>
  <button class="btn gray" id="setBtn" title="설정">⚙</button>
</header>
<div id="st">불러오는 중…</div>

<div id="set" class="box"><div class="form">
  <label>Apps Script 웹 앱 URL (…/exec · 넣으면 이걸로 읽고 [수정] 가능)</label><input id="sGas">
  <label>Apps Script 열쇠</label><input id="sTok" type="password">
  <label>또는 시트 '웹에 게시' 주소 (…/pub · 읽기만)</label><input id="sPub">
  <label>BWTS 탭 gid / SCRUBBER 탭 gid (웹게시일 때)</label><div class="row2"><input id="sGidB"><input id="sGidS"></div>
  <label>BWTS 도면 폴더 (도면 주소 복사용)</label><input id="sDwg" placeholder="O:\…\BWTS FINAL dwg">
  <label>내 영문 이름 / 한글 이름</label><div class="row2"><input id="sEn"><input id="sKo"></div>
  <label>수주 알림 받는 사람</label><input id="sTo">
  <div style="margin-top:10px;display:flex;gap:6px;align-items:center"><button class="btn" id="setSave">저장</button><button class="btn gray" id="setClose">닫기</button>
  <span class="note" style="margin:0">이 PC 의 이 브라우저에만 저장됩니다.</span></div>
</div></div>

<div id="res" class="box"></div>
<div id="ship" class="box"><div class="empty">선명을 검색해 배를 고르세요.</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
// ── 설정 ──
// ★이 파일은 공개 GitHub Pages 에 올린다 → 시트 주소·Apps Script 주소·열쇠·사내 경로를 파일에 넣지 않는다.
//   처음 한 번 ⚙ 에 넣으면 이 브라우저(localStorage)에 저장된다.
const DEF = {pub: '', gas: '', tok: '', gidB: '695648690', gidS: '0', dwg: '', en: 'Logan Yun', ko: '윤석준', to: ''};
const SKEY = 'am_mail_light2';
let CFG = {...DEF};
try { Object.assign(CFG, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem(SKEY, JSON.stringify(CFG)); } catch (e) {} };
const useGas = () => !!(CFG.gas && CFG.tok);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ml = s => esc(s).replace(/\r\n?/g, '\n').split('\n').join('<br>');
const nz = s => String(s || '').toUpperCase().replace(/[^A-Z0-9가-힣]/g, '');
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2600); };

// ── 시트 읽기 ──
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
// 열 찾기 — 앱(sales_ledger)과 같은 규칙: 공백 무시 대문자, 정확일치 > 앞부분 일치(짧은 것) > 포함
const hn = h => String(h || '').toUpperCase().replace(/\s+/g, '');
function colOf(header, aliases) {
  const H = header.map(hn), A = aliases.map(hn);
  for (const a of A) { const i = H.indexOf(a); if (i >= 0) return i; }
  for (const a of A) { const c = H.map((h, i) => [h, i]).filter(([h]) => h.startsWith(a)).sort((x, y) => x[0].length - y[0].length); if (c.length) return c[0][1]; }
  for (const a of A) { const i = H.findIndex(h => h.includes(a)); if (i >= 0) return i; }
  return -1;
}
let ALL = [], CUR = null, TAB = 'info';
function mkRow(t, header, r, n) {
  const v = {_t: t, _n: n, _h: header, _r: r};
  v.col = (...a) => colOf(header, a);
  v.get = (...a) => { const c = v.col(...a); return c >= 0 ? String(r[c] || '').trim() : ''; };
  v.set = (c, val) => { r[c] = val; fill(v); };
  fill(v);
  return v;
}
function fill(v) {
  Object.assign(v, {ship: v.get('SHIP NAME'), imo: v.get('IMO'), hull: v.get('프로젝트', 'PROJECT', 'HULL'),
    owner: v.get('SHIP OWNER'), country: v.get('국가'), order: v.get('수주번호')});
}
const tabRows = (t, rows) => { const h = rows[0] || []; return rows.slice(1).map((r, i) => mkRow(t, h, r, i + 2)).filter(v => v.ship && v.ship !== '-'); };
async function loadCsv(gid, t) {
  const r = await fetch(CFG.pub + '?output=csv&gid=' + encodeURIComponent(gid) + '&t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error(t + ' 탭 HTTP ' + r.status);
  const txt = await r.text();
  if (txt.trim().startsWith('<')) throw new Error(t + ' 탭을 읽지 못했습니다(웹게시 주소·gid 확인)');
  return tabRows(t, parseCSV(txt));
}
async function loadGas() {
  const r = await fetch(CFG.gas + '?token=' + encodeURIComponent(CFG.tok) + '&t=' + Date.now(), {cache: 'no-store'});
  const j = await r.json().catch(() => null);
  if (!j || !j.ok) throw new Error('Apps Script: ' + ((j && j.error) || ('응답 오류 HTTP ' + r.status)));
  return ['BWTS', 'SCRUBBER'].map(t => tabRows(t, j.tabs[t] || []));
}
async function load() {
  if (location.protocol === 'file:') {
    $('st').textContent = '웹 주소로 열어 주세요 — 파일을 직접 열면(file://) 브라우저 보안 때문에 시트를 못 읽습니다.';
    return;
  }
  if (!CFG.pub && !useGas()) { $('st').textContent = '처음 설정 필요 — ⚙ 에 Apps Script 주소·열쇠(또는 웹게시 주소)를 넣으세요.'; openSet(); return; }
  $('st').textContent = '구글시트 불러오는 중…';
  try {
    const [b, s] = useGas() ? await loadGas() : await Promise.all([loadCsv(CFG.gidB, 'BWTS'), loadCsv(CFG.gidS, 'SCRUBBER')]);
    ALL = b.concat(s);
    const d = new Date();
    $('st').textContent = `BWTS ${b.length} · SCRUBBER ${s.length}척 · ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')} 기준 · ${useGas() ? 'Apps Script' : '웹게시(읽기만)'}`;
    if (CUR) { const again = ALL.find(v => v._t === CUR._t && v.ship === CUR.ship && v.imo === CUR.imo); if (again) pick(again, true); }
  } catch (e) { $('st').textContent = '불러오기 실패 — ' + e.message; }
}

// ── 검색 (결과는 작은 목록, 고르면 닫힘) ──
function search() {
  const k = nz($('q').value), box = $('res');
  if (k.length < 2) { box.style.display = 'none'; return; }
  const hit = ALL.map(v => {
    const s = nz(v.ship), sc = s === k ? 0 : s.startsWith(k) ? 1 : s.includes(k) ? 2
      : (nz(v.imo).includes(k) || nz(v.hull) === k) ? 3 : nz(v.hull).includes(k) ? 4 : nz(v.owner).includes(k) ? 5 : 9;
    return [sc, v];
  }).filter(x => x[0] < 9).sort((a, b) => a[0] - b[0] || a[1].ship.localeCompare(b[1].ship)).slice(0, 40).map(x => x[1]);
  box.style.display = 'block';
  box.innerHTML = hit.length ? hit.map((v, i) => `<button data-i="${i}"><span class="s">${esc(v.ship)}</span><span class="tag ${v._t === 'BWTS' ? 'b' : 's'}">${v._t}</span>
      <span class="m">${esc([v.hull, v.imo, v.owner].filter(Boolean).join(' · '))}</span></button>`).join('') : '<div class="empty">없음</div>';
  box.querySelectorAll('button').forEach(b => b.onclick = () => { box.style.display = 'none'; pick(hit[+b.dataset.i]); });
  if (hit.length === 1) box.querySelector('button').click();
}

// ── 날짜·수량 ──
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function pdate(s) {
  s = String(s || '').trim(); if (!s) return null;
  if (/^\d{5}$/.test(s)) { const d = new Date(Date.UTC(1899, 11, 30) + (+s) * 864e5); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  if (/^\d{8}$/.test(s)) return new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6));
  const n = s.match(/\d+/g); if (n && n.length >= 3) { let y = +n[0]; if (y < 100) y += 2000; return new Date(y, +n[1] - 1, +n[2]); }
  return null;
}
// 수량이 있는 값 — 숫자가 0보다 커야 한다 (SCRUBBER in/out 칸에는 'TriOS' 같은 제조사명이 있다)
const hasQty = v => { const n = String(v || '').match(/\d+(\.\d+)?/g); return !!n && n.some(x => +x > 0); };

// ── 도면 폴더 — 'BWTS FINAL dwg' 아래 번호 구간 폴더(앱의 도면 찾기와 같은 구간) ──
const DWG_RANGES = [[1, 500], [501, 812], [813, 1000], [1001, 1500], [1501, 2000], [2001, 2500]];
const p5 = n => String(n).padStart(5, '0');
function dwgPath(no) {
  const n = parseInt(String(no).replace(/\D/g, ''), 10); if (!n) return '';
  const r = DWG_RANGES.find(x => x[0] <= n && n <= x[1]) || [Math.floor((n - 1) / 500) * 500 + 1, Math.floor((n - 1) / 500) * 500 + 500];
  return CFG.dwg.replace(/[\\/]+$/, '') + '\\' + `${p5(r[0])}~${p5(r[1])} 번대`;
}
function copyDwg(no) {
  if (!CFG.dwg) { toast('⚙ 설정에 BWTS 도면 폴더를 먼저 넣어 주세요'); openSet(); return; }
  copyText(dwgPath(no), `도면 폴더 주소 복사 — 탐색기 주소창에 붙여 넣고 ${p5(parseInt(String(no).replace(/\D/g, ''), 10))} 로 시작하는 폴더`);
}

// ── 선박 정보 (기본 화면) — 앱 카드 순서 ──
const INFO = {
  BWTS: [['선박정보'], ['선명', ['SHIP NAME']], ['프로젝트', ['프로젝트', 'PROJECT', 'HULL']], ['IMO', ['IMO']], ['선종', ["SHIP'S TYPE", 'SHIP TYPE', '선종']],
    ['선주사 정보'], ['선주사', ['SHIP OWNER'], 'fe'], ['국가', ['국가'], 'fe'],
    ['BWTS 정보'], ['SPEC', ['SPEC (DESIGN)']], ['PT', 'pt'], ['TT / TT(EX)', ['TT'], ['TT (EX)']], ['UVI / FMU', ['UVI'], ['FMU']], ['UV LAMP', ['UV LAMP']],
    ['도면번호', ['DRAW NO'], 'dwg'], ['설계담당자', ['설계담당자']],
    ['수주현황'], ['2025 실행일자', ['2025 실행일자']], ['2026 실행일자', ['2026 실행일자']], ['SERVICE 형태', ['SERVICE 형태']], ['수주번호', ['수주번호']], ['REMARK', ['REMARK']]],
  SCRUBBER: [['선박정보'], ['선명', ['SHIP NAME']], ['프로젝트', ['PROJECT (HULL NO.)', 'PROJECT', 'HULL']], ['IMO', ['IMO']], ['선종', ["SHIP'S TYPE", 'SHIP TYPE']],
    ['선주사 정보'], ['선주사', ['SHIP OWNER'], 'fe'], ['국가', ['국가'], 'fe'],
    ['SCRUBBER 정보'], ['SYSTEM', ['SYSTEM']], ['TUR / PaH', ['TUR'], ['PaH']], ['in TUR / in PaH', ['in TUR'], ['in PaH']],
    ['out TUR / out PaH', ['out TUR'], ['out PaH']], ['wtu TUR / wtu PaH', ['wtu TUR'], ['wtu PaH']], ['OTP DATE', ['OTP DATE']],
    ['수주현황'], ['계약 STATUS', ['계약 STATUS']], ['수주번호', ['수주번호']], ['REMARK', ['REMARK']]]
};
// [[묶음이름]] 또는 [이름, 값, 종류]
function infoList(v) {
  const out = [];
  for (const it of INFO[v._t]) {
    if (it.length === 1) { out.push([it[0]]); continue; }
    const [lb, a1, a2] = it;
    let val;
    if (a1 === 'pt') { const pt = v.get('PT'), m = v.get('MTR (PT)', 'MTR(PT)'); val = pt ? pt + (m ? ` (${m}MTR)` : '') : ''; }
    else { val = v.get(...a1); if (Array.isArray(a2)) { const b = v.get(...a2); val = val && b ? `${val} / ${b}` : (val || b); } }

// ── 견적 파일명 — 앱(erp_quote.file_name)과 같은 규칙: [QUOTE] 선명_BWTS MRO[ 종류]_YYYYMMDD ──
//   MRO 는 꼬리 없음, REFURB·CALIBRATION 은 'BWTS MRO REFURB' 처럼. SCRUBBER 탭 배면 'SCRUBBER MRO'.
//   확장자(.pdf)는 붙이지 않는다 — 저장 창이 알아서 붙인다.
const QUOTE_KINDS = ['MRO', 'REFURB', 'CALIBRATION'];
// 호선 폴더명 — 앱(erp_quote._ship_folder_name)과 같다: 선명 (프로젝트)_IMO  (프로젝트·IMO 가 없으면 그 부분만 뺀다)
const safeName = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim();
function folderName(v) {
  let nm = safeName(v.ship) || 'SHIP';
  if (v.hull) nm += ` (${safeName(v.hull)})`;
  const imo = String(v.imo || '').replace(/\D/g, '');
  if (imo.length === 7) nm += '_' + imo;
  return nm;
}
function quoteName(v, kind) {
  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const ship = String(v.ship || 'SHIP').replace(/[\\/:*?"<>|]/g, '_').trim();
  return `[QUOTE] ${ship}_${v._t === 'BWTS' ? 'BWTS' : 'SCRUBBER'} MRO${kind === 'MRO' ? '' : ' ' + kind}_${ymd}`;
}

// ── 선주사·국가 [수정] — 시트에 있는 이름을 추천, 저장하면 시트에 바로 (같은 배의 다른 탭도) ──
function feNames(f) {
  const m = new Map();
  ALL.forEach(v => { const x = (f === 'owner' ? v.owner : v.country).trim(); if (x) m.set(x, (m.get(x) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
async function gasPost(body) {
  // text/plain 으로 보내야 브라우저가 사전 확인(preflight) 없이 바로 보낸다 — Apps Script 는 본문만 읽는다
  const r = await fetch(CFG.gas, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({token: CFG.tok}, body))});
  return r.json();
}
function feEdit(btn) {
  if (!useGas()) { toast('시트 수정은 Apps Script 로 연결했을 때만 됩니다 (⚙ 설정)'); return; }
  const f = btn.dataset.f, v = CUR, hdrAl = f === 'owner' ? ['SHIP OWNER'] : ['국가'], cur = f === 'owner' ? v.owner : v.country;
  const td = btn.closest('td'), keep = td.innerHTML, lid = 'feL' + Date.now();
  td.innerHTML = `<div class="fe-row"><input list="${lid}" value="${esc(cur)}" placeholder="${f === 'owner' ? '선주사' : '국가'} 입력·선택">
    <datalist id="${lid}">${feNames(f).map(([n, c]) => `<option value="${esc(n)}">${c}척</option>`).join('')}</datalist>
    <button class="btn sm fe-ok">저장</button><button class="btn gray sm fe-no">취소</button></div><div class="fe-msg"></div>`;
  const inp = td.querySelector('input'), msg = td.querySelector('.fe-msg'), okb = td.querySelector('.fe-ok');
  inp.focus(); inp.select();
  td.querySelector('.fe-no').onclick = () => { td.innerHTML = keep; renderInfo(); };
  inp.onkeydown = e => { if (e.key === 'Enter') okb.click(); if (e.key === 'Escape') td.querySelector('.fe-no').click(); };
  okb.onclick = async () => {
    const val = inp.value.trim();
    if (val === cur) { renderInfo(); return; }
    if (!val) { msg.textContent = '값을 넣어 주세요'; msg.style.color = '#c2410c'; return; }
    okb.disabled = true; msg.textContent = '시트에 저장 중…'; msg.style.color = '';
    // 같은 배: 이 행 + 다른 탭(BWTS↔SCRUBBER)의 같은 IMO(없으면 같은 선명) 행
    const sib = ALL.filter(x => x !== v && x._t !== v._t && ((v.imo && x.imo === v.imo) || (!v.imo && nz(x.ship) === nz(v.ship))));
    const res = [];
    for (const x of [v].concat(sib)) {
      const c = x.col(...hdrAl); if (c < 0) { res.push([x, {ok: false, error: '열 없음'}]); continue; }
      let j; try { j = await gasPost({tab: x._t, keys: {order: x.order, imo: x.imo, ship: x.ship}, fields: {[x._h[c]]: val}}); } catch (e) { j = {ok: false, error: String(e)}; }
      if (j && j.ok) x.set(c, val);
      res.push([x, j || {ok: false, error: '응답 없음'}]);
    }
    if (!res[0][1].ok) { okb.disabled = false; msg.textContent = '저장 실패 — ' + (res[0][1].error || ''); msg.style.color = '#c2410c'; return; }
    const bad = res.slice(1).filter(r => !r[1].ok);
    toast(`✅ ${f === 'owner' ? '선주사' : '국가'} 저장 — ${val}` + (res.length > 1 ? (bad.length ? ` (다른 탭 ${bad.length}곳 실패)` : ` (${res[1][0]._t} 탭도 같이)`) : ''));
    render();
  };
}

// ── 행 편집 (2026-11-18) — 시트 행 전체를 창에서 고쳐 한 번에 저장. 묶음·순서는 앱(sales_ledger.EDIT_LAYOUT)과 같다 ──
const EDIT_LAYOUT = [
  ['선박정보', ['SHIP NAME', '프로젝트', 'IMO']],
  ['선주사 정보', ['SHIP OWNER', '국가']],
  ['BWTS 정보', ['SPEC (DESIGN)', 'PT', 'MTR (PT)', 'TT (EX)', 'TT', 'UVI', 'FMU', 'UV LAMP', 'DRAW NO', '설계 담당자']],
  ['SCRUBBER 정보', ['SYSTEM', 'in TUR', 'in PaH', 'out TUR', 'out PaH', 'wtu TUR', 'wtu PaH', 'TUR', 'PaH', 'OTP DATE']],
  ['수주현황', ['2025 견적', '2025 수주', '2025 실행일자', '2025 수주 금액', '2025 실비금액', '2026 견적', '2026 수주', '2026 실행일자',
    '2026 수주금액', '2026 실비금액', '2026 총수주액', '2026 SERVICE 형태', '2025년 수주', '2026년 견적', '2026년 수주', '계약 STATUS', 'REMARK']]];
// 머리글 → [[묶음, [열…]]…, ['기타', [나머지 열]]]. ★'2026 수주'가 '2026 수주금액'을 먼저 가져가지 않게 정확일치부터
function editLayout(header) {
  const H = header.map(hn), used = new Set(), out = [];
  for (const [g, al] of EDIT_LAYOUT) {
    const items = [];
    for (const a of al) {
      const A = hn(a);
      let c = H.map((h, i) => i).filter(i => !used.has(i) && H[i] === A);
      if (!c.length) c = H.map((h, i) => i).filter(i => !used.has(i) && H[i].startsWith(A)).sort((x, y) => H[x].length - H[y].length);
      if (!c.length) c = H.map((h, i) => i).filter(i => !used.has(i) && H[i].includes(A)).sort((x, y) => H[x].length - H[y].length);
      if (c.length) { used.add(c[0]); items.push(c[0]); }
    }
    if (items.length) out.push([g, items]);
  }
  const rest = header.map((h, i) => i).filter(i => !used.has(i) && String(header[i] || '').trim());
  if (rest.length) out.push(['기타', rest]);
  return out;
}
function closeOv() { const o = document.querySelector('.ov'); if (o) o.remove(); }
function rowEdit(v) {
  if (!useGas()) { toast('행 편집은 Apps Script 로 연결했을 때만 됩니다 (⚙ 설정)'); return; }
  closeOv();
  // 체크박스 칸: 값이 TRUE/FALSE 이거나, 'YYYY 견적'·'YYYY 수주'·'YYYY년 수주' 열(빈칸이어도 — 빈칸 = 해제)
  const isChk = c => /^(TRUE|FALSE)$/i.test(String(v._r[c] || '').trim()) || /^20\d\d년?(견적|수주)$/.test(hn(v._h[c]));
  const field = c => {
    const h = String(v._h[c] || '').replace(/\s+/g, ' ').trim(), val = String(v._r[c] || '');
    const inp = isChk(c) ?`<input type="checkbox" data-c="${c}"${/^TRUE$/i.test(val) ? ' checked' : ''}>`
      : (/REMARK|SPEC|특이|메모/i.test(h) ? `<textarea data-c="${c}">${esc(val)}</textarea>` : `<input type="text" data-c="${c}" value="${esc(val)}">`);
    return `<div class="ed-r"><label title="${esc(v._h[c])}">${esc(h)}</label>${inp}</div>`;
  };
  const L = editLayout(v._h);
  const main = L.filter(g => g[0] !== '기타').map(([g, cs]) => `<div class="ed-g">${esc(g)}</div>` + cs.map(field).join('')).join('');
  const more = L.filter(g => g[0] === '기타').map(([, cs]) => `<details class="ed-more"><summary>기타 열 ${cs.length}개</summary>${cs.map(field).join('')}</details>`).join('');
  document.body.insertAdjacentHTML('beforeend', `<div class="ov"><div class="win">
    <div class="wh"><b>행 편집 · ${esc(v.ship)} <span class="tag ${v._t === 'BWTS' ? 'b' : 's'}">${v._t}</span></b><button class="btn gray sm" data-x>✕</button></div>
    <div class="wb">${main}${more}</div>
    <div class="wf"><span class="note" id="edMsg" style="flex:1;margin:0">바꾼 칸은 노랗게 표시됩니다</span><button class="btn gray" data-x>취소</button><button class="btn" id="edSave">저장</button></div></div></div>`);
  const ov = document.querySelector('.ov');
  ov.querySelectorAll('[data-x]').forEach(b => b.onclick = closeOv);
  const now = el => el.type === 'checkbox' ? (el.checked ? 'TRUE' : 'FALSE') : el.value.trim();
  const orig = el => { const s = String(v._r[+el.dataset.c] || '').trim(); return el.type === 'checkbox' ? (/^TRUE$/i.test(s) ? 'TRUE' : 'FALSE') : s; };
  ov.querySelectorAll('[data-c]').forEach(el => el.oninput = el.onchange = () => el.classList.toggle('chg', now(el) !== orig(el)));
  $('edSave').onclick = async () => {
    const fields = {}, lines = [];
    ov.querySelectorAll('[data-c]').forEach(el => { if (now(el) !== orig(el)) { const c = +el.dataset.c; fields[v._h[c]] = now(el); lines.push([v._h[c], orig(el), now(el), c]); } });
    if (!lines.length) { $('edMsg').textContent = '바뀐 칸이 없습니다'; return; }
    $('edSave').disabled = true; $('edMsg').textContent = '시트에 저장 중…';
    const keys = {order: v.order, imo: v.imo, ship: v.ship};
    let j; try { j = await gasPost({tab: v._t, keys, fields}); } catch (e) { j = {ok: false, error: String(e)}; }
    if (!j || !j.ok) { $('edSave').disabled = false; $('edMsg').textContent = '저장 실패 — ' + ((j && j.error) || ''); $('edMsg').style.color = '#c2410c'; return; }
    lines.forEach(([, , n, c]) => v._r[c] = n); fill(v);
    closeOv(); render();
    savedModal(v, lines, j.before || {});
  };
}
// 저장 확인 — [확인] 닫기 · [되돌리기] 바꾸기 전 값으로 다시 저장
function savedModal(v, lines, before) {
  document.body.insertAdjacentHTML('beforeend', `<div class="ov"><div class="win" style="max-width:420px">
    <div class="wh"><b>✅ 저장하였습니다</b></div>
    <div class="wb" style="padding-top:8px">${lines.map(([h, o, n]) => `<div class="sv-l"><b>${esc(String(h).replace(/\s+/g, ' '))}</b> : <s>${esc(o) || '(빈칸)'}</s> → ${esc(n) || '(빈칸)'}</div>`).join('')}</div>
    <div class="wf"><button class="btn gray" id="svUndo">되돌리기</button><button class="btn" id="svOk">확인</button></div></div></div>`);
  $('svOk').onclick = closeOv;
  $('svUndo').onclick = async () => {
    const fields = {}; lines.forEach(([h, o]) => fields[h] = (h in before) ? before[h] : o);
    $('svUndo').disabled = true;
    let j; try { j = await gasPost({tab: v._t, keys: {order: v.order, imo: v.imo, ship: v.ship}, fields}); } catch (e) { j = {ok: false, error: String(e)}; }
    if (!j || !j.ok) { $('svUndo').disabled = false; toast('되돌리기 실패 — ' + ((j && j.error) || '')); return; }
    lines.forEach(([h, o, , c]) => v._r[c] = (h in before) ? before[h] : o); fill(v);

  };
}

      + blank + pp(P, '기타 궁금하신 점이나 도움이 필요하신 사항이 있으시면 언제든지 연락 주시기 바랍니다.')
      + blank + pp(B, '&middot;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Vessel Info.') + items.map((x, i) => pp(N, `${i + 1}. ${x[0]} ${esc(x[1])}`)).join('')
      + blank + pp(P, '* 한국외 지역에서 서비스 필요시 이동 및 실비가 추가될 수 있으니 서비스 필요시 회신 부탁드립니다.') + blank + '</div>'};
}
const SVC_OPTS = ['MRO SERVICE (2M)', 'MRO SERVICE (1M)', 'REFURB 센서만 발송', 'SENSOR CALIBRATION ONLY'];
const svcText = (eq, o) => o === 'MRO SERVICE (2M)' ? `${eq} MRO SERVICE - 2M 1D` : o === 'MRO SERVICE (1M)' ? `${eq} MRO SERVICE - 1M 1D`
  : o === 'REFURB 센서만 발송' ? `${eq} MRO SERVICE - REFURB 센서만 발송` : o;
let ON = null;
function onInit(v) {
  const eq = v._t === 'BWTS' ? 'BWTS' : 'SCRUBBER', sens = [];
  if (eq === 'SCRUBBER') [['TUR', 'TUR'], ['PaH', 'PaH'], ['in TUR', 'in TUR'], ['in PaH', 'in PaH'], ['out TUR', 'out TUR'], ['out PaH', 'out PaH']]
    .forEach(([lb, h]) => { const q = v.get(h); if (hasQty(q)) sens.push([lb, q + 'EA']); });
  else { const mtr = v.get('MTR (PT)', 'MTR(PT)');
    [['PT', 'PT'], ['TT', 'TT'], ['TT (EX)', 'TT (EX)'], ['UVI', 'UVI'], ['FMU', 'FMU']].forEach(([lb, h]) => {
      const q = v.get(h); if (hasQty(q)) sens.push([lb === 'PT' && mtr ? `PT (${mtr}M)` : lb, q + 'EA']); }); }
  ON = {equip: eq, order_no: '', customer: v.owner, ship_line: v.hull ? `${v.ship} (${v.hull})` : v.ship, svc: SVC_OPTS[0],
        service_text: svcText(eq, SVC_OPTS[0]), sensors: sens, schedule: '', agency: '', remark: '', po: '', billing: '', sales: CFG.ko || ''};
}
function notice(v) {
  const d = ON, TD = 'border:1px solid #000000;padding:3px 7px;vertical-align:top;' + F_KO, TH = TD + 'background-color:#e2efda;font-weight:700;text-align:center;';
  const P = 'margin:0;' + F_KO, blank = pp(P, '&nbsp;'), h = t => t || '&nbsp;';
  let c4 = d.service_text ? ml(d.service_text) : '&nbsp;';
  const rows = d.sensors.filter(r => String(r[0]).trim() && hasQty(r[1]));
  if (rows.length) c4 += '<table style="border-collapse:collapse;margin-top:4px;">' + rows.map(r => `<tr><td style="${TD}">${esc(r[0])}</td><td style="${TD}">${esc(r[1])}</td></tr>`).join('') + '</table>';
  const items = [['1', '수주번호', h(esc(d.order_no))], ['2', '고객사', h(esc(d.customer))], ['3', '선명', h(esc(d.ship_line))], ['4', '서비스사항', c4],
    ['5', '본선스케줄', h(ml(d.schedule))], ['6', '대리점정보', h(ml(d.agency))], ['7', '특이사항', h(ml(d.remark))], ['8', 'PO', h(ml(d.po))], ['9', 'BILLING ADDRESS', h(ml(d.billing))]];
  const tbl = `<table style="border-collapse:collapse;width:760px;"><tr><td style="${TH};width:44px;">NO.</td><td style="${TH};width:126px;">SUBJECT</td><td style="${TH}">CONTENTS</td></tr>`
    + items.map(([n, s, c]) => `<tr><td style="${TD};text-align:center;">${n}</td><td style="${TD}">${s}</td><td style="${TD}">${c}</td></tr>`).join('') + '</table>';
  const sched = (d.schedule || '').split(/\s+/).join(' ').slice(0, 80);
  return {subject: '[MRO 수주 알림] >> ' + [v.ship, d.customer, d.equip, d.order_no, d.po, sched].map(x => String(x || '').trim()).filter(Boolean).join(' / '),
    html: `<div style="${F_KO}">` + pp(P, '수신 : MRO 운영 담당자님') + pp(P, `발신 : ${esc(d.sales || '_____')} 프로 // 파나시아 MRO 팀`) + blank
      + pp(P, '업무에 노고 많으십니다.') + pp(P, `${esc(d.equip)} MRO 수주 확인하여 아래와 같이 수주 정보 공유하여 드립니다.`)
      + pp(P, '아래 정보 참고하시어 후속 업무 부탁드립니다.') + blank + tbl + blank + '</div>'};
}

// ── 화면 ──
const TABS = [['info', '선박 정보'], ['renew_en', '재계약 (영)'], ['renew_ko', '재계약 (한)'], ['notice', '수주 알림']];
function pick(v, keepTab) { CUR = v; onInit(v); if (!keepTab) TAB = 'info'; render(); }
function render() {
  const v = CUR; if (!v) return;
  $('ship').innerHTML = `<h2>${esc(v.ship)}<span class="tag ${v._t === 'BWTS' ? 'b' : 's'}">${v._t}</span></h2>
    <div class="tabs">${TABS.map(([k, l]) => `<button data-k="${k}" class="${k === TAB ? 'on' : ''}">${l}</button>`).join('')}</div><div id="body"></div>`;
  $('ship').querySelectorAll('.tabs button').forEach(b => b.onclick = () => { TAB = b.dataset.k; render(); });
  if (TAB === 'info') { renderInfo(); return; }
  $('body').innerHTML = `<div class="form" id="frm"></div>
    <div class="pv-h" style="margin-top:12px"><b>미리보기</b><button class="btn gray sm" id="cpS">제목 복사</button><button class="btn sm" id="cpB">본문 복사</button></div>
    <div class="subj" id="pvS"></div><div id="pv"></div>
    <div class="note">[본문 복사] → 아웃룩 전달·새 메일 본문에 Ctrl+V (표·글꼴 그대로). 서명은 아웃룩 설정대로 붙습니다.</div>`;
  $('cpS').onclick = () => copyText($('pvS').textContent, '제목을 복사했습니다');
  $('cpB').onclick = () => copyHtml(built().html);
  if (TAB === 'notice' && v._t === 'BWTS') {          // 앱 수주 알림의 [GOOGLE SHEET] 와 같은 한 줄 (BWTS 전용시트)
    $('cpS').insertAdjacentHTML('beforebegin', '<button class="btn gray sm" id="cpG" title="BWTS 전용시트에 붙일 한 줄 (선명·PROJECT·IMO·고객사·PO·수주번호·센서·PT미터)">GOOGLE SHEET</button>');
    $('cpG').onclick = () => copyText(sheetLine(v), '시트 한 줄을 복사했습니다 — 구글시트 첫 칸을 누르고 Ctrl+V');
  }
  form(); preview();
}
// 열 순서(앱과 같음): 선명 / PROJECT / IMO / 고객사 / PO / 수주번호 / PT / TT(EX) / TT / UVI / (빈칸) / PT 미터
//   센서 수량은 수주 알림 창에서 고친 값이 먼저, 없으면 시트 값
function sheetLine(v) {
  const c = {};
  ON.sensors.forEach(([lb, q]) => {
    const n = (String(q).match(/\d+(\.\d+)?/) || [''])[0], L = String(lb).toUpperCase().replace(/\s+/g, '');
    const k = L.startsWith('PT') ? 'pt' : L.startsWith('TT(EX)') ? 'ttex' : L === 'TT' ? 'tt' : L.startsWith('UVI') ? 'uvi' : '';
    if (k && n) c[k] = n;
  });
  let mtr = v.get('MTR (PT)', 'MTR(PT)').trim();
  if (mtr && /^[\d.]+$/.test(mtr)) mtr += 'M';
  return [v.ship, v.hull, v.imo, v.owner, ON.po, ON.order_no,
          c.pt || v.get('PT'), c.ttex || v.get('TT (EX)'), c.tt || v.get('TT'), c.uvi || v.get('UVI'), '', mtr]
    .map(x => String(x || '').replace(/[\t\r\n]+/g, ' ').trim()).join('\t');
}
function form() {
  const f = $('frm');
  if (TAB === 'renew_en' || TAB === 'renew_ko') {
    const L = lastService(CUR), en = TAB === 'renew_en';
    f.innerHTML = `<div class="note" style="margin:0">마지막 서비스 ${esc(L.last)} → 다음 ${esc(L.next)} · SPEC ${esc(CUR.get('SPEC (DESIGN)') || CUR.get('SYSTEM') || '-')}</div>
      <label>${en ? '내 영문 이름' : '내 한글 이름'}</label><input id="fMe" value="${esc(en ? CFG.en : CFG.ko)}">`;
    $('fMe').oninput = e => { CFG[en ? 'en' : 'ko'] = e.target.value; saveCfg(); preview(); };
    return;
  }
  const d = ON;
  f.innerHTML = `<div class="row2"><div><label>1. 수주번호</label><input data-f="order_no" value="${esc(d.order_no)}" placeholder="H2026…"></div>
      <div><label>8. PO</label><input data-f="po" value="${esc(d.po)}"></div></div>
    <label>2. 고객사</label><input data-f="customer" value="${esc(d.customer)}">
    <label>3. 선명</label><input data-f="ship_line" value="${esc(d.ship_line)}">
    <label>4. 서비스사항</label><select id="fSvc">${SVC_OPTS.map(o => `<option${o === d.svc ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>
    <textarea data-f="service_text" style="margin-top:4px">${esc(d.service_text)}</textarea>
    <label>센서 (수량 0·빈칸은 메일에서 빠짐)</label><div id="fSens"></div><button class="mini" id="fAdd">+ 센서 추가</button>
    <label>5. 본선스케줄</label><textarea data-f="schedule">${esc(d.schedule)}</textarea>
    <label>6. 대리점정보</label><textarea data-f="agency">${esc(d.agency)}</textarea>
    <label>7. 특이사항</label><textarea data-f="remark">${esc(d.remark)}</textarea>
    <label>9. BILLING ADDRESS</label><textarea data-f="billing">${esc(d.billing)}</textarea>
    <div class="row2"><div><label>발신 (영업 담당자)</label><input data-f="sales" value="${esc(d.sales)}"></div>
      <div><label>받는 사람</label><div style="display:flex;gap:4px"><input id="fTo" value="${esc(CFG.to)}"><button class="mini" id="cpTo">복사</button></div></div></div>`;
  f.querySelectorAll('[data-f]').forEach(el => el.oninput = () => { ON[el.dataset.f] = el.value; preview(); });
  $('fSvc').onchange = e => { ON.svc = e.target.value; ON.service_text = svcText(ON.equip, ON.svc); form(); preview(); };
  $('fTo').oninput = e => { CFG.to = e.target.value; saveCfg(); };
  $('cpTo').onclick = () => CFG.to ? copyText(CFG.to, '받는 사람을 복사했습니다') : toast('받는 사람이 비어 있습니다');
  const sens = () => {
    $('fSens').innerHTML = ON.sensors.map((r, i) => `<div class="sens"><input data-i="${i}" data-k="0" value="${esc(r[0])}"><input data-i="${i}" data-k="1" value="${esc(r[1])}"><button data-x="${i}" title="빼기">✕</button></div>`).join('');
    $('fSens').querySelectorAll('input').forEach(el => el.oninput = () => { ON.sensors[+el.dataset.i][+el.dataset.k] = el.value; preview(); });
    $('fSens').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { ON.sensors.splice(+b.dataset.x, 1); sens(); preview(); });
  };
  sens();
  $('fAdd').onclick = () => { ON.sensors.push(['', '']); sens(); };
}
function built() { return TAB === 'renew_en' ? renewEN(CUR) : TAB === 'renew_ko' ? renewKO(CUR) : TAB === 'notice' ? notice(CUR) : infoMail(CUR); }
function preview() { const m = built(); $('pvS').textContent = m.subject; $('pv').innerHTML = m.html; }

// ── 복사 (서식 유지) ──
async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(msg);
}
async function copyHtml(html) {
  const tmp = document.createElement('div'); tmp.innerHTML = html;
  try {
    await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type: 'text/html'}),
      'text/plain': new Blob([tmp.innerText], {type: 'text/plain'})})]);
  } catch (e) {                                   // 클립보드 API 가 막히면 화면 밖에 그려서 선택·복사
    tmp.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(tmp);
    const r = document.createRange(); r.selectNodeContents(tmp);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); tmp.remove();
  }
  toast('본문을 복사했습니다 — 아웃룩 본문에 Ctrl+V');
}

// ── 설정 ──
function openSet() {
  $('set').style.display = 'block';
  $('sGas').value = CFG.gas || ''; $('sTok').value = CFG.tok || ''; $('sPub').value = CFG.pub || '';
  $('sGidB').value = CFG.gidB; $('sGidS').value = CFG.gidS; $('sDwg').value = CFG.dwg || '';
  $('sEn').value = CFG.en; $('sKo').value = CFG.ko; $('sTo').value = CFG.to;
}
$('setBtn').onclick = () => $('set').style.display === 'block' ? $('set').style.display = 'none' : openSet();
$('setClose').onclick = () => $('set').style.display = 'none';
$('setSave').onclick = () => {
  const pub = ($('sPub').value.trim().match(/^https:\/\/docs\.google\.com\/spreadsheets\/d\/e\/[A-Za-z0-9_-]+\/pub/) || [''])[0];
  const gas = ($('sGas').value.trim().match(/^https:\/\/script\.google\.com\/[^\s?#]+\/exec/) || [''])[0], tok = $('sTok').value.trim();
  if ($('sGas').value.trim() && !gas) { toast('Apps Script 주소 형식이 아닙니다 (https://script.google.com/…/exec)'); return; }
  if (gas && !tok) { toast('Apps Script 열쇠를 넣어 주세요'); return; }
  if (!pub && !gas) { toast('Apps Script 주소 또는 웹게시 주소(…/pub)를 넣어 주세요'); return; }
  Object.assign(CFG, {pub, gas, tok, gidB: $('sGidB').value.trim(), gidS: $('sGidS').value.trim(), dwg: $('sDwg').value.trim(),
    en: $('sEn').value.trim(), ko: $('sKo').value.trim(), to: $('sTo').value.trim()});
  saveCfg(); $('set').style.display = 'none'; toast('저장했습니다'); load();
};

let qt = null;
$('q').oninput = () => { clearTimeout(qt); qt = setTimeout(search, 200); };
$('q').onkeydown = e => { if (e.key === 'Enter') search(); if (e.key === 'Escape') $('res').style.display = 'none'; };
$('q').onfocus = () => { if ($('q').value.trim().length >= 2) search(); };
$('find').onclick = search;
$('reload').onclick = load;
load();
$('q').focus();
</script>
